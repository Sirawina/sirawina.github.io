<!doctype html>

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="./styles.css">

  <style>
    .masonry {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      column-gap: 16px;
      width: 100%;
    }

    .masonry-column {
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-width: 0;
    }

    /* IMAGE-BASED SUBPAGE HEADER */

    .subpage-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 40px;
      width: 100%;
      margin: 0 0 28px;
      white-space: nowrap;
    }

    .subpage-back {
      display: block;
      line-height: 0;
    }

    .subpage-back img {
      display: block;
      width: auto;
      height: 34px;
      max-width: none;
    }

    .subpage-title {
      display: block;
      line-height: 0;
    }

    .subpage-title img {
      display: block;
      width: auto;
      height: 34px;
      max-width: none;
    }

    .subpage-back:hover,
    .subpage-back:focus-visible {
      opacity: 0.65;
    }

    .subpage-back:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 4px;
    }

    /* IMAGE LIGHTBOX */

    .image-toggle {
      display: none;
    }

    .image-lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.75);
    }

    .image-toggle:checked + .image-lightbox {
      display: flex;
    }

    .image-lightbox img {
      display: block;
      max-width: 90vw;
      max-height: 90vh;
      width: auto;
      height: auto;
      cursor: zoom-out;
    }

    .masonry-item > label {
      display: block;
      cursor: zoom-in;
    }

    .top-link {
      position: fixed;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      display: block;
      line-height: 0;
    }

    .top-link img {
      display: block;
      width: auto;
      height: 20px;
      max-width: none;
    }

    @media (max-width: 899px) {
      .masonry {
        grid-template-columns: 1fr;
      }

      .subpage-header {
        gap: 16px;
        margin-bottom: 22px;
      }

      .subpage-back img,
      .subpage-title img {
        height: 39.2px;
      }
    }
  </style>

</head>
