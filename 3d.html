<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MILOŠ ŽIVKOVIĆ - 3D</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="./styles.css">

  <style>
    .masonry {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      column-gap: 16px;
      width: 100%;
    }

    .masonry-column {
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-width: 0;
    }

    .construction {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 100;
      color: #4a494a;
      font-family: "Montserrat", Arial, sans-serif;
      font-size: 50px;
      font-weight: 900;
      line-height: 1;
      white-space: nowrap;
    }

    @media (max-width: 899px) {
      .masonry {
        grid-template-columns: 1fr;
      }

      .construction {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <main class="subpage">

    <header class="subpage-header">

      <a
        class="subpage-back"
        href="./"
      >
        MILOŠ ŽIVKOVIĆ
      </a>

      <span class="subpage-title">
        3D DESIGN
      </span>

    </header>


    <div class="construction">
      UNDER CONSTRUCTION 🛠️
    </div>


  </main>

</body>
</html>
