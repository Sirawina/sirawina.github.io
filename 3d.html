<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MILOŠ ŽIVKOVIĆ - 3D</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="./styles.css">

  <style>
    .subpage-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 40px;
      width: 100%;
      margin: 0 0 28px;
      white-space: nowrap;
    }

    .subpage-back,
    .subpage-title {
      display: block;
      line-height: 0;
    }

    .subpage-back img,
    .subpage-title img {
      display: block;
      width: auto;
      height: 34px;
      max-width: none;
    }

    .subpage-back:hover,
    .subpage-back:focus-visible {
      opacity: 0.65;
    }

    .subpage-back:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 4px;
    }

    .masonry {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      column-gap: 16px;
      width: 100%;
    }

    .masonry-column {
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-width: 0;
    }

    .construction {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 100;
      color: #4a494a;
      font-size: 50px;
      font-weight: 900;
      line-height: 1;
      white-space: nowrap;
    }

    @media (max-width: 899px) {
      .subpage-header {
        gap: 16px;
        margin-bottom: 22px;
      }

      .subpage-back img,
      .subpage-title img {
        height: 39.2px;
      }

      .masonry {
        grid-template-columns: 1fr;
      }

      .construction {
        font-size: 24px;
      }
    }
  </style>

</head>

<body>

  <main class="subpage">


<header class="subpage-header">

  <a
    class="subpage-back"
    href="./about"
    aria-label="MILOŠ ŽIVKOVIĆ"
  >
    <img
      src="./landing/milos.png"
      alt="MILOŠ ŽIVKOVIĆ"
    >
  </a>

  <span
    class="subpage-title"
    aria-label="3D DESIGN"
  >
    <img
      src="./landing/3d.png"
      alt="3D DESIGN"
    >
  </span>

</header>

<div class="construction">
  UNDER CONSTRUCTION 🛠️
</div>


  </main>

</body>
</html>
