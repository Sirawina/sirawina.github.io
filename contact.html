<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MILOŠ ŽIVKOVIĆ - CONTACT</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="./styles.css">

  <style>
    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    /* IMAGE-BASED SUBPAGE HEADER */

    .subpage-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 30px;
      width: 100%;
      margin: 0 0 28px;
      white-space: nowrap;
    }

    .subpage-back {
      display: block;
      line-height: 0;
    }

    .subpage-back img {
      display: block;
      width: auto;
      height: 24px;
      max-width: none;
    }

    .subpage-title {
      display: block;
      line-height: 0;
    }

    .subpage-title img {
      display: block;
      width: auto;
      height: 24px;
      max-width: none;
    }

    .subpage-back:hover,
    .subpage-back:focus-visible {
      opacity: 0.65;
    }

    .subpage-back:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 4px;
    }

    .contact-links {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;

      margin-top: 60px;

      color: #4a494a;

      font-family: "Courier New Bold", Courier, monospace;
      font-size: 20px;
      line-height: 1.2;
      font-weight: 800;

      white-space: nowrap;
    }

    @media (max-width: 899px) {
      .subpage {
        padding-top: 32px;
      }

      .subpage-header {
        gap: 16px;
        margin-bottom: 22px;
      }

      .subpage-back img,
      .subpage-title img {
        height: 39.2px;
      }

      .contact-links {
        margin-top: 60px;
        font-size: 16px;
      }
    }
  </style>

</head>

<body>

  <main class="subpage">


<header class="subpage-header">

  <a
    class="subpage-back"
    href="./"
    aria-label="MILOŠ ŽIVKOVIĆ"
  >
    <img
      src="./landing/milos.png"
      alt="MILOŠ ŽIVKOVIĆ"
    >
  </a>

  <span
    class="subpage-title"
    aria-label="CONTACT"
  >
    <img
      src="./landing/contact.png"
      alt="CONTACT"
    >
  </span>

</header>


<div class="contact-links">
  <div>mail:sirawina@protonmail.com</div>
  <div>in:@sirawina</div>
  <div>ig:@sirawina</div>
</div>


  </main>

</body>
</html>
