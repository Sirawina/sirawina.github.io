<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MILOŠ ŽIVKOVIĆ - ABOUT</title>
  <link rel="stylesheet" href="./styles.css">
  <style>
html, body {
  width: 100%;
  min-height: 100%;
  margin: 0;
}

body {
  min-height: 100vh;
  overflow-x: hidden;
  overflow-y: auto;
}

.subpage {
  min-height: 100vh;
  position: relative;
  padding-top: 40px;
  text-align: center;
  white-space: nowrap;
}

.subpage-back {
  display: inline-block;
  color: #4a494a;
  text-decoration: none;
  font-size: 24px;
  line-height: 1;
  letter-spacing: -0.96px;
  transition: color 0.15s ease;
}

.subpage-title {
  display: inline-block;
  margin-left: 20px;
  color: #e23030;
  font-size: 24px;
  line-height: 1;
  letter-spacing: -0.96px;
}

.subpage-back:hover,
.subpage-back:focus-visible {
  color: #a0a0a0;
}

.subpage-back:focus-visible {
  outline: 2px solid #b7b7b7;
  outline-offset: 4px;
}

@media (max-width: 899px) {
  .subpage {
    padding-top: 32px;
  }

  .subpage-back,
  .subpage-title {
    font-size: 19.2px;
    letter-spacing: -0.768px;
  }

  .subpage-title {
    margin-left: 16px;
  }
}
</style>
</head>
<body>
  <main class="subpage">
    <a class="subpage-back" href="./index.html">MILOŠ ŽIVKOVIĆ</a>
    <span class="subpage-title">ABOUT</span>
  </main>
</body>
</html>
