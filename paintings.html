  <style>
    .masonry {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      column-gap: 16px;
      width: 100%;
    }

    .masonry-column {
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-width: 0;
    }

    /* IMAGE LIGHTBOX */

    .image-toggle {
      display: none;
    }

    .image-lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.75);
    }

    .image-toggle:checked + .image-lightbox {
      display: flex;
    }

    .image-lightbox img {
      display: block;
      max-width: 90vw;
      max-height: 90vh;
      width: auto;
      height: auto;
      cursor: zoom-out;
    }

    .masonry-item > label {
      display: block;
      cursor: zoom-in;
    }

    @media (max-width: 899px) {
      .masonry {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
